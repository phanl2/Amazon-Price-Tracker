name: Daily Amazon Scraper

# Run at 8:00 AM UTC every day
# Adjust UTC offset if needed
on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 UTC every day
  workflow_dispatch:  # allows manual run

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install beautifulsoup4 requests lxml pandas scikit-learn

    - name: Initialize database
      run: python -c "from database import init_db; init_db()"

    - name: Run scraper
      run: |
        python scraper.py

    - name: Upload database
      uses: actions/upload-artifact@v4
      with:
        name: prices-db
        path: prices.db
